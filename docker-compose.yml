# LifeOS 自托管部署（Docker Compose）
# 架构：nginx(80/443 HTTPS) 反代 → next 容器；SQLite 数据持久化到 volume
#
# 正式访问：https://daimoli.xyz
# 证书：宿主机 ./certs 目录（fullchain.pem + privkey.pem）挂载进 nginx 容器，见 README.md

services:
  next:
    image: lifeos-next
    container_name: lifeos-next
    restart: unless-stopped
    environment:
      # ── 数据库：本地 SQLite（解耦 Turso）──
      - DATABASE_URL=file:./data/db/lifeos.db
      # 清空 Turso 变量，确保 getClient() 走本地 SQLite
      - TURSO_DATABASE_URL=
      - TURSO_AUTH_TOKEN=
      # ── 认证 ──
      - APP_PASSWORD=${APP_PASSWORD:-demo}
      # 双入口（http://IP:3000 直连 + https://域名）必须为 false；仅走 HTTPS 域名可设 true
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # 备案号页脚（工信部要求公网域名首页底部展示；不设则无页脚）
      - NEXT_PUBLIC_ICP_BEIAN=${NEXT_PUBLIC_ICP_BEIAN:-豫ICP备2026036606号-1}
      # ── 其他 ──
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # SQLite 数据库持久化到命名 volume（换机器只需备份此 volume）
      - lifeos-data:/app/data
    ports:
      # http://IP:3000 直连入口（与 https://域名 双入口并存）
      - "3000:3000"
    # 限制容器日志大小，防止 json-file 驱动无限增长把磁盘吃满
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 启动前确保 db/ 目录存在（volume 挂载会遮蔽镜像内建的目录），再执行迁移（建表）
    command: sh -c "mkdir -p /app/data/db && npm run migrate && npm run start"

  nginx:
    image: nginx:alpine
    container_name: lifeos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/lifeos.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书：宝塔/certbot 在宿主机申请后放入 ./certs 目录（fullchain.pem + privkey.pem）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - next

volumes:
  lifeos-data:
    driver: local
