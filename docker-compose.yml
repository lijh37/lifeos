# LifeOS 自托管部署（Docker Compose）
# 架构：nginx(80/443 HTTPS) 反代 → next 容器；数据持久化到 volumes
#
# 正式访问：https://daimoli.xyz
# 证书：宿主机 ./certs 目录（fullchain.pem + privkey.pem）挂载进 nginx 容器，见 DEPLOY.md

services:
  next:
    image: lifeos-next
    container_name: lifeos-next
    restart: unless-stopped
    environment:
      # ── 数据库：本地 SQLite（解耦 Turso）──
      - DATABASE_URL=file:./data/db/lifeos.db
      # 清空 Turso 变量，确保 getClient() 走本地 SQLite
      - TURSO_DATABASE_URL=
      - TURSO_AUTH_TOKEN=
      # ── 存储：本地磁盘（解耦 Vercel Blob）──
      - STORAGE_DRIVER=local
      - UPLOAD_DIR=/app/data/uploads
      - UPLOAD_URL_PREFIX=/uploads
      # ── 认证 ──
      - APP_PASSWORD=${APP_PASSWORD:-demo}
      # HTTPS 阶段必须为 true（Secure cookie 仅在 HTTPS 下回传）
      - COOKIE_SECURE=true
      # ── 其他 ──
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # 数据库 + 附件，持久化到命名 volume（换机器只需备份此 volume）
      - lifeos-data:/app/data
    expose:
      - "3000"
    # 限制容器日志大小，防止 json-file 驱动无限增长把磁盘吃满
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 启动前确保 db/ 目录存在（volume 挂载会遮蔽镜像内建的目录），再执行迁移（建表）
    command: sh -c "mkdir -p /app/data/db && npm run migrate && npm run start"

  nginx:
    image: nginx:alpine
    container_name: lifeos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/lifeos.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书：宝塔/certbot 在宿主机申请后放入 ./certs 目录（fullchain.pem + privkey.pem）
      - ./certs:/etc/nginx/certs:ro
      # 附件静态目录：与 next 容器共享同一 volume，由 nginx 直出（更快）
      - lifeos-data:/app/data:ro
    depends_on:
      - next

volumes:
  lifeos-data:
    driver: local
