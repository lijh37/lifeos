# LifeOS Nginx 配置（备案后生产方案，域名 daimoli.xyz）
# 架构：80 全部 301 → 443 HTTPS；443 反代到 next 容器；/uploads/ 由 nginx 直出
#
# TLS 证书：compose 将宿主机 ./certs 目录只读挂载到 /etc/nginx/certs/
#   文件：fullchain.pem（证书链）+ privkey.pem（私钥）
#   获取：宝塔或 certbot 在宿主机申请后放入 ./certs 目录
#   续期：续期成功后需 docker compose restart nginx（或 docker exec lifeos-nginx nginx -s reload）

# ── HTTP：全站强制跳转 HTTPS ──
server {
    listen 80;
    server_name daimoli.xyz;

    return 301 https://$host$request_uri;
}

# ── HTTPS ──
server {
    listen 443 ssl;
    http2 on;
    server_name daimoli.xyz;

    # TLS 证书（挂载自宿主机 ./certs）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 客户端上传上限（匹配附件 10MB 限制，留余量）
    client_max_body_size 12m;

    # ── 附件静态直出（本地磁盘，nginx 直接服务，绕过 Node）──
    # URL 形如 /uploads/<uuid>.<ext>
    location /uploads/ {
        alias /app/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 防止目录遍历
        autoindex off;
    }

    # ── 反代到 Next.js 容器 ──
    location / {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
